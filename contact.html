<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Chaikhana</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header>
    <nav class="site-nav navbar navbar-expand-md navbar-dark">
      <div class="container">
        <a class="navbar-brand brand" href="index.html">Chaikhana</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="about.html">About</a></li><li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li><li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li><li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li></ul></div>
      </div>
    </nav>
  </header>
  <main>
    <section>
      <div class="container">
        <div class="row g-5">
          <div class="col-md-6">
            <h1 class="h2">Reserve a table</h1>
            <form action="#" method="post">
              <div class="mb-3"><label for="name" class="form-label">Name</label><input type="text" id="name" name="name" class="form-control" required></div>
              <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" required></div>
              <div class="mb-3"><label for="guests" class="form-label">Guests</label>
                <select id="guests" name="guests" class="form-select"><option>1-2</option><option>3-5</option><option>6-10</option></select></div>
              <div class="mb-3"><label for="msg" class="form-label">Message</label><textarea id="msg" name="msg" rows="4" class="form-control"></textarea></div>
              <button type="submit" class="btn btn-saffron">Send request</button>
            </form>
          </div>
          <div class="col-md-6">
            <h2 class="h4">Find us</h2>
            <address>12 Silk Road Street<br>Open daily, 9:00-22:00<br>hello@chaikhana.example</address>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer text-center">
    <div class="container"><p class="mb-1">&copy; 2026 Chaikhana Tea House. Open daily, 9:00-22:00.</p><p class="mb-0"><a href="contact.html">Reserve a table</a></p></div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
